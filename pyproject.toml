[project]
name = "ember-cfd-ts"
dynamic = ["version"]
description = "Turbostream 3 (TS3) file-format plugin for EMBER CFD"
readme = "README.md"
authors = [
    { name = "James Brind", email = "jb753@cam.ac.uk" }
]
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
# Follows SPEC 0's Python support window: https://scientific-python.org/specs/spec-0000/
requires-python = ">=3.12"
dependencies = [
    # Tracks core's dev branch, not a release: this plugin needs the post-0.1.0
    # patch API (non-reflecting inlets, the OutletPatch.Kp/Ki accessors) that no
    # published version carries yet. Temporary, and deliberately so -- a direct
    # URL dependency cannot be uploaded to PyPI, so this must become a version
    # bound (>=0.2.0,<0.3) when core next releases.
    "ember-cfd @ git+https://github.com/jb753/ember@dev",
    "h5py~=3.16.0",
    "numpy~=2.5.0",
    "pyyaml~=6.0.3",
    "scipy",
]

[project.urls]
Homepage = "https://ember-cfd.org"
Documentation = "https://ember-cfd.org"
Source = "https://github.com/jb753/ember-cfd-ts"

[tool.setuptools.packages.find]
# PEP 420 namespace: ship only ember/plugins/ts, letting `ember` and
# `ember.plugins` resolve as namespaces shared with the core ember install.
where = ["src"]
namespaces = true

[tool.uv]
managed = true

# Develop against the sibling ember working copy rather than the published
# release: this plugin tracks core APIs (Grid alignment, Block/patch accessors)
# ahead of what is on PyPI.
#
# A plain relative path, not `workspace = true`: this package must resolve
# standalone (checked out beside a sibling `../ember`) as well as nested
# under the ember-paper superproject (which checks the two out as siblings
# too). A path source needs no workspace membership on either side, so it
# works unchanged in both layouts. It must also NOT declare its own
# [tool.uv.workspace] table -- that would make uv treat it as a nested
# workspace root and refuse to resolve under the superproject's workspace.
[tool.uv.sources]
ember-cfd = { path = "../ember", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.ruff.lint]
ignore = ["E741"]  # match core ember

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]

[build-system]
requires = ["setuptools>=77,<90", "setuptools-scm>=8", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/ember/plugins/ts/_version.py"
