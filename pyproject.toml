[project]
name = "ember-cfd-ts"
dynamic = ["version"]
description = "Turbostream 3 and 4 (TS3, TS4) plugin for EMBER CFD"
readme = "README.md"
authors = [
    { name = "James Brind", email = "jb753@cam.ac.uk" }
]
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
# Follows SPEC 0's Python support window: https://scientific-python.org/specs/spec-0000/
requires-python = ">=3.12"
dependencies = [
    # Capped below the next minor: until 1.0.0 a minor release may break the
    # public API, but patch releases do not. 0.4.8 is the floor, the first to
    # carry everything this plugin uses -- the dP_throttle convergence field,
    # NonMatchPatch and CuspPatch, and BaseSolver.soft/restart with
    # run(grid, workdir). A range, not a pin, so an exact pin downstream (as
    # turbigen's) picks the version; uv.lock records the one tested against.
    "ember-cfd~=0.4.8",
    "h5py~=3.16.0",
    "numpy~=2.5.0",
    "pyyaml~=6.0.3",
    # Floor per SPEC 0, as for Python above; only scipy.spatial.KDTree is used.
    "scipy>=1.15",
]

[project.urls]
Homepage = "https://ember-cfd.org"
Documentation = "https://ember-cfd.org"
Source = "https://github.com/jb753/ember-cfd-ts"

[tool.setuptools.packages.find]
# PEP 420 namespace: ship only ember/plugins/ts, letting `ember` and
# `ember.plugins` resolve as namespaces shared with the core ember install.
where = ["src"]
namespaces = true

[tool.uv]
managed = true

# No [tool.uv.sources]: ember-cfd comes from PyPI at the pinned release. A
# superproject that develops against an ember working copy declares that
# source in its own root, which applies to every workspace member. This
# package must NOT declare its own [tool.uv.workspace] table: uv treats that
# as a nested workspace root and refuses to resolve it under a superproject's
# workspace.

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.ruff.lint]
ignore = ["E741"]  # match core ember

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]

[build-system]
requires = ["setuptools>=77,<90", "setuptools-scm>=8", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/ember/plugins/ts/_version.py"
